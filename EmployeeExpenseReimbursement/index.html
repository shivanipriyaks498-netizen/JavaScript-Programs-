<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Expense Reimbursement</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Employee Expense Reimbursement</h1>
        <p>Check your eligible business expense reimbursement.</p>

        <form id="expenseForm">
            <label for="employeeId">Employee ID</label>
            <input type="text" id="employeeId" required>

            <label for="category">Expense Category</label>
            <select id="category" required>
                <option value="">Select category</option>
                <option value="Travel">Travel</option>
                <option value="Accommodation">Accommodation</option>
                <option value="Food">Food</option>
                <option value="Other">Other</option>
            </select>

            <label for="amount">Expense Amount (₹)</label>
            <input type="number" id="amount" min="0.01" step="0.01" required>

            <label for="days">Number of Days</label>
            <input type="number" id="days" min="1" step="1" required>

            <label for="documents">Supporting Documentation</label>
            <select id="documents" required>
                <option value="">Select an option</option>
                <option value="yes">Submitted</option>
                <option value="no">Not Submitted</option>
            </select>

            <button type="submit">Evaluate Expense</button>
        </form>

        <div id="result" aria-live="polite"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
